name: MyFirstCI

# Run on every push to main and on every PR targeting main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"  # keep in sync with the Dockerfile base image
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # pytest exits non-zero on a failing test, which marks the check red
      - run: pytest
