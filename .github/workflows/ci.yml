name: MyFirstCI

# Run on every push to main and on every PR targeting main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"  # keep in sync with the Dockerfile base image
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # pytest exits non-zero on a failing test, which marks the check red
      - run: pytest

  build:                                   # al doilea job, la același nivel cu "test"
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: read                       # poate citi codul
      packages: write                      # poate urca în GHCR
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4          # pregătește builder-ul

      - uses: docker/login-action@v4                 # se loghează în registry
        with:
          registry: ghcr.io
          username: ${{ github.actor }}              # cine a pornit rularea
          password: ${{ secrets.GITHUB_TOKEN }}      # token-ul automat

      - uses: docker/build-push-action@v7            # build + push
        with:
          context: .                                 # build context = rădăcina repo-ului
          platforms: linux/amd64,linux/arm64                     # pentru ce arhitecturi
          push: true                                 # urcă imaginea după build
          tags: |
            ghcr.io/${{ github.repository_owner }}/todo-api:latest
            ghcr.io/${{ github.repository_owner }}/todo-api:${{ github.sha }}
